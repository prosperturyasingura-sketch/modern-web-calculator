<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Modern Web Calculator</title>
</head>
<body>
<div class="structure">
    <div class="Calc">
        <input type="text" placeholder="0" readonly>
        <div class="clicks">
            <button id="clear">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="sign">÷</button>
        
        <button>7</button>
         <button>8</button>
          <button>9</button>
           <button class="sign">x</button>
        
        
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="sign">-</button>
        
        
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="sign">+</button>
        
        
            <button class="null">0</button>
            <button>.</button>
            <button class="sign">=</button>
    </div>
</div>
</body>
</html>
